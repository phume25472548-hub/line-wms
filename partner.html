<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#123b35">
  <meta name="robots" content="noindex,nofollow">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'">
  <title>合作伙伴库存与订单 | LINE WMS</title>
  <link rel="stylesheet" href="partner.css?v=1.0.0">
  <script src="partner.js?v=1.0.0" defer></script>
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <a class="brand" href="partner.html" aria-label="LINE WMS 合作伙伴门户">
        <span class="brand-mark">W</span>
        <span><strong>LINE WMS</strong><small>合作伙伴门户</small></span>
      </a>
      <div class="top-actions"><span class="secure-label"><span class="secure-dot"></span>只读访问</span><button id="logout" class="text-button" type="button" hidden>退出</button></div>
    </header>

    <section id="login-view" class="login-layout">
      <div class="intro">
        <p class="eyebrow">PARTNER ACCESS</p>
        <h1>库存与订单，<br>一目了然。</h1>
        <p class="intro-copy">查看合作库存和订单进度。此门户仅提供查询功能，不支持修改库存或订单。</p>
        <div class="trust-note"><span aria-hidden="true">◉</span><span>连接已加密 · 需要专属访问密码</span></div>
      </div>
      <form id="login-form" class="login-card" autocomplete="on">
        <div class="card-icon" aria-hidden="true">↗</div>
        <h2>合作伙伴登录</h2>
        <p class="muted">请输入管理员提供的访问密码。</p>
        <label for="password">访问密码</label>
        <div class="password-wrap"><input id="password" name="password" type="password" autocomplete="current-password" required minlength="16" maxlength="256" placeholder="输入访问密码"><button id="show-password" type="button" aria-label="显示密码" title="显示密码">显示</button></div>
        <p id="login-error" class="error" role="alert" hidden></p>
        <button id="login-submit" class="primary-button" type="submit"><span>安全登录</span><span aria-hidden="true">→</span></button>
        <p class="footnote">如需开通或重置访问权限，请联系 LINE WMS 管理员。</p>
      </form>
    </section>

    <section id="dashboard-view" hidden>
      <div class="welcome-row"><div><p class="eyebrow">PARTNER OVERVIEW</p><h1>库存与订单</h1><p class="muted">仅显示合作伙伴所需信息</p></div><button id="refresh" class="refresh-button" type="button"><span aria-hidden="true">↻</span> 刷新数据</button></div>
      <div id="load-error" class="notice error-notice" role="alert" hidden></div>
      <div id="sync-note" class="sync-note" hidden></div>
      <div class="section-heading"><div><h2>库存概况</h2><p>按商品查看可售与待检数量</p></div><span id="sku-count" class="count-pill">— 件商品</span></div>
      <div id="stock-grid" class="stock-grid"><div class="loading-card">正在安全加载库存…</div></div>
      <div class="section-heading orders-heading"><div><h2>近期订单</h2><p>订单状态与商品数量</p></div><span id="order-count" class="count-pill">— 笔订单</span></div>
      <div id="orders-list" class="orders-list"><div class="loading-card">正在加载订单…</div></div>
      <footer class="dashboard-footer">数据仅供合作业务查询 · LINE WMS</footer>
    </section>
  </main>
  <noscript><p class="noscript">此页面需要启用 JavaScript 才能安全登录并加载数据。</p></noscript>
</body>
</html>
